<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="本機粵語轉錄：行號、時間戳及講者標記，錄音留在你的 Mac。">
  <title>粵語轉錄</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
<main>
  <header><div><h1>粵語轉錄<span>本機</span></h1><p>錄音留喺你部 Mac。</p></div><div class="connection"><i id="light"></i><span id="connection">未連接</span></div></header>
  <section id="setup" class="setup"><details open><summary>先啟動 Mac 本機程式</summary><p>下載程式後，雙擊 <code>Start.command</code>，再用自動開啟嘅網頁。首次轉錄會下載模型。</p><div class="links"><a href="https://github.com/honest4794/cantonese-transcriber" target="_blank" rel="noreferrer">下載及安裝說明</a><a id="local-link" href="http://127.0.0.1:8765/" target="_blank" rel="noreferrer">已啟動？開啟本機介面</a></div></details></section>
  <form id="form">
    <label class="file-zone" id="dropzone"><input type="file" id="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.flac,.ogg,.mp4,.mov,.webm"><strong id="file-name">選擇錄音</strong><span id="file-help">或將檔案拖到呢度 · 上限 512 MB</span></label>
    <div class="actions"><label>講者人數 <select id="speakers"><option value="2">2 位</option><option value="3">3 位</option><option value="4">4 位</option><option value="1">1 位</option><option value="0">不分講者（較快）</option></select></label><div><button id="cancel" type="button" class="secondary" hidden>取消</button><button id="start" type="submit" disabled>開始轉錄</button></div></div>
  </form>
  <section id="status-area" aria-live="polite" hidden><div class="progress-label"><span id="status">準備中</span><span id="percent"></span></div><progress id="progress" max="100" value="0"></progress></section>
  <p id="error" role="alert" hidden></p>
  <section id="result" hidden>
    <div class="result-heading"><div><h2>逐字稿 <span id="count"></span></h2><p>點時間播放錄音；文字同講者可以直接修改。自動結果仍需核對。</p></div><div class="exports"><label class="sr-only" for="format">下載格式</label><select id="format"><option value="txt">文字 TXT</option><option value="csv">表格 CSV</option><option value="srt">字幕 SRT</option></select><button id="download" type="button" class="secondary">下載</button></div></div>
    <audio id="audio" controls preload="metadata"></audio>
    <div class="transcript-head"><span>行</span><span>時間</span><span>講者</span><span>內容</span></div>
    <div id="lines"></div>
  </section>
  <footer><a href="https://github.com/honest4794/cantonese-transcriber" target="_blank" rel="noreferrer">程式碼與使用說明</a><span>本機處理 · 無雲端上傳</span></footer>
</main>
</body>
</html>
